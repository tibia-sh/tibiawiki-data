name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Release runs take turns. Two in parallel would both find a new version missing and race
# to publish it, and the loser would fail red. One in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max  # a waiting run is kept rather than replaced by a newer one, though GitHub does not guarantee their order

jobs:
  # The oldest and the newest published servers that depend on this package's major, each
  # installed together with the packed index, page every item. scripts/oldest-consumer.ts says
  # why. It runs on every push, not only on one that publishes, so an index that breaks either
  # server shows red even when nothing is published.
  oldest-consumer:
    runs-on: ubuntu-latest
    # The script's own bounds add up to 2190 s, summed beside the value: 120 s to pack the
    # candidate and 30 s for the registry, then 120 s to pack, 300 s to install and 600 s to
    # sweep each of two consumers. The rest is room for checkout and setup.
    timeout-minutes: 45  # 120 + 30 + 2 * (120 + 300 + 600) = 2190 s, 36.5 minutes
    permissions:
      contents: read
    steps:
      # No ref: the commit that triggered the run, which is the one the release job publishes.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          # No dependency cache in the release workflow. This setup-node restores one by itself
          # whenever package.json names a packageManager, so it is switched off by name.
          package-manager-cache: false
      # The npm the release job installs, so the gate packs and installs with that same npm.
      - run: npm install -g npm@12.0.2
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      # It leaves the pnpm store uncached. It caches its lockfile-verification record whatever the
      # inputs say, and saves the record right after the install, before the gate runs the servers
      # it installs from npm. When that save does not go through, its post step tries again at the
      # end of the job, after them.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      - run: pnpm oldest-consumer

  release:
    # Nothing is published unless the gate passed on this same commit.
    needs: oldest-consumer
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish.outputs.released }}  # 'true' once npm accepted the publish, else empty
      version: ${{ steps.publish.outputs.version }}    # the version it accepted
    permissions:
      contents: read   # check out the merged commit
      id-token: write  # OIDC for npm trusted publishing
    steps:
      # No ref: a push run checks out the commit that triggered it, which is the commit npm
      # provenance names.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          # No dependency cache in the job that publishes. This setup-node restores one by
          # itself whenever package.json names a packageManager, so it is switched off by name.
          package-manager-cache: false
      # setup-node brings the npm bundled with the Node release, and trusted publishing needs
      # >= 11.5.1. Pinned exactly, not @latest: this job holds id-token: write. It is
      # installed before the check, so the npm that reads the registry is the one that publishes.
      - run: npm install -g npm@12.0.2
      # A version is published once, when npm does not have it yet. This checks existence and
      # never compares with latest: a revert leaves version below latest, and npm publish
      # moves latest itself.
      - name: Check whether npm already has this version
        id: registry
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          # npm view name@version exits 1 both for a version npm lacks and for a registry it
          # cannot read, so this reads the whole version list instead. npm exits non-zero when
          # it cannot read the list, and node throws unless it got a non-empty one. Either
          # assignment then ends this step red under bash -e, so an outage is never mistaken
          # for a missing version.
          versions=$(npm view "$name" versions --json)
          published=$(node -e '
            const [list, version] = process.argv.slice(1);
            const versions = JSON.parse(list);
            if (!Array.isArray(versions) || versions.length === 0) throw new Error("npm listed no versions: " + list);
            console.log(versions.includes(version));
          ' "$versions" "$version")
          if [ "$published" = true ]; then
            echo "$name@$version is on npm already, so nothing is published."
          else
            echo "$name@$version is not on npm yet, so this run publishes it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      # It leaves the pnpm store uncached. It caches its lockfile-verification record whatever the
      # inputs say, and saves the record right after the install. When that save does not go
      # through, its post step tries again at the end of the job.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        if: ${{ steps.registry.outputs.publish == 'true' }}
        with:
          install: true
          require-lockfile: true
      # The suite is the major-version guard: SCHEMA_VERSION, the package major and the
      # index's mcp_schema_version row must agree before anything is published.
      - run: pnpm test
        if: ${{ steps.registry.outputs.publish == 'true' }}
      # Packs the committed index.db. prepublishOnly runs pnpm test once more first. Then it hands
      # the hosting job what it published. The default bash -e stops the script at a failed publish,
      # so released is 'true' or empty. The version is read before the publish, so a version this
      # step cannot read publishes nothing.
      - id: publish
        if: ${{ steps.registry.outputs.publish == 'true' }}
        run: |
          version=$(node -p 'require("./package.json").version')
          npm publish
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Tells tibia-sh/mcp.tibia.sh about the release, so its bump.yml pins the version and deploys it.
  # A job of its own, because the token is a secret of the release-trigger environment, and naming
  # that environment in the release job would put an environment claim in its OIDC token, which
  # npm's trusted publisher rejects. It runs only once the release job published, so a push that
  # publishes nothing skips it.
  hosting:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: release-trigger
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # gh api exits non-zero on an HTTP error and prints it, and timeout stops a request that hangs
      # after 120 seconds, or kills it 10 seconds later if it ignores that. A dispatch that got through
      # twice is harmless, because bump.yml finds the version pinned or its pull request open, so a
      # failed attempt is tried again 30 seconds later, three attempts in all. Three attempts that all
      # hang take 7.5 minutes, inside the job's 8. gh reads the token from GH_TOKEN by itself, so the
      # script never names it.
      - name: Tell mcp.tibia.sh about the release
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.HOSTING_DISPATCH_TOKEN }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The published version must look like 1.2.3, and this run has \"$VERSION\"."
            exit 1
          fi
          body="$(jq -n --arg version "$VERSION" '{event_type: "first-party-release", client_payload: {package: "@tibia.sh/tibiawiki-data", version: $version}}')"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
            fi
            if timeout --kill-after=10 120 gh api repos/tibia-sh/mcp.tibia.sh/dispatches --input - <<< "$body"; then
              echo "Told tibia-sh/mcp.tibia.sh about @tibia.sh/tibiawiki-data $VERSION in attempt $attempt."
              exit 0
            fi
          done
          echo "::error::Could not tell tibia-sh/mcp.tibia.sh about @tibia.sh/tibiawiki-data $VERSION in 3 attempts, 30 seconds apart. Run bump.yml there by hand, as \"The hosting dispatch\" in docs/RELEASING.md describes."
          exit 1
