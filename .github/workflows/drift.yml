name: drift

# Rebuilds index.db from the live wiki and compares its content with the committed index.
# When the content changed, it pushes drift/index with the rebuilt index and the next patch
# version, opens or updates its pull request, turns on auto-merge and waits for the merge.
# The ruleset merges it once test and oldest-consumer pass, and that merge publishes through
# release.yml. Nothing here publishes by itself. A refresh that loses rows, as
# scripts/drift-guard.ts decides, is held instead: its pull request stays open with auto-merge
# off until a person merges or closes it. A run on main that fails or holds a refresh comments
# on one issue, assigned to the maintainer.

on:
  schedule:
    - cron: '17 6 * * 2,5' # Tuesdays and Fridays at 06:17 UTC
  workflow_dispatch:

# Each job asks for what it needs, and a job that asks for nothing gets nothing.
permissions: {}

# Runs take turns, so two cannot push drift/index at once. One in progress is never
# cancelled. The group is not release.yml's, so a drift run never holds up a publish.
concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The 3.0.0 build took just under six minutes on a laptop. The rest is room for uv, and
    # for the wiki API's retries.
    timeout-minutes: 60
    # It runs the generator over content anyone can edit, so it can only read.
    permissions:
      contents: read
    outputs:
      committed: ${{ steps.digests.outputs.committed }}
      rebuilt: ${{ steps.digests.outputs.rebuilt }}
      sha256: ${{ steps.digests.outputs.sha256 }}
      changed: ${{ steps.digests.outputs.changed }}
      # The guard runs only when the content changed. A skipped step's output is empty, so hold
      # falls back to false and the alert job never reads an empty value.
      hold: ${{ steps.guard.outputs.hold || 'false' }}
      reasons: ${{ steps.guard.outputs.reasons }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # No cache, restored or saved, but pnpm/setup's lockfile-verification record. A cache saved
      # after the generator ran would carry whatever that run left into later runs. This setup-node
      # caches by itself whenever package.json names a packageManager, so it is switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      # It leaves the pnpm store uncached, and saves its lockfile-verification record right after
      # the install, before the generator runs. When that save does not go through, its post step
      # tries again at the end of the job, after the generator.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      # build-index installs and runs the generator with uv. This setup-uv ships a checksum for uv 0.12.4
      # and installs no download that fails it. It has no checksum for a later uv, and skips the
      # check for one, so the version stays exact and no newer than the action.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          enable-cache: false
      # Before the build, which overwrites index.db in place.
      - name: Digest the committed index
        id: committed
        run: |
          digest=$(node_modules/.bin/tibiawiki-mcp index-digest index.db)
          if [[ ! $digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "index-digest did not print a SHA-256 hex digest for the committed index." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The guard compares the rebuilt index's row counts with these.
      - name: Keep the committed index for the guard
        run: |
          cp index.db "$RUNNER_TEMP/committed.db"
      # A tripped gate fails the run here, and leaves index.db as it was. scripts/build.ts
      # gives the generator its PyPI cooldown, so this step sets none.
      - run: pnpm build-index
      - name: Digest the rebuilt index
        id: digests
        env:
          COMMITTED: ${{ steps.committed.outputs.digest }}
        run: |
          rebuilt=$(node_modules/.bin/tibiawiki-mcp index-digest index.db)
          # The pr job checks the artifact it downloads against this.
          sha256=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("index.db")).digest("hex"))')
          # COMMITTED too: a misspelt output reference arrives as an empty string, and two
          # empty digests would compare equal on every run.
          for value in "$COMMITTED" "$rebuilt"; do
            if [[ ! $value =~ ^[0-9a-f]{64}$ ]]; then
              echo "Not a SHA-256 hex digest: '$value'" >&2
              exit 1
            fi
          done
          echo "Committed index digest: $COMMITTED"
          echo "Rebuilt index digest:   $rebuilt"
          if [ "$COMMITTED" = "$rebuilt" ]; then
            changed=false
            echo "The content did not change, so no pull request is opened."
          else
            changed=true
            echo "The content changed, so the pr job opens or updates the drift pull request."
          fi
          {
            echo "committed=$COMMITTED"
            echo "rebuilt=$rebuilt"
            echo "sha256=$sha256"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
      # The suite, against the rebuilt index, before anything leaves this job.
      - run: pnpm test
      # Whether the refresh may merge by itself. Each line the guard prints is a reason to hold it
      # for a person, and none means go.
      - name: Guard the refresh
        id: guard
        if: ${{ steps.digests.outputs.changed == 'true' }}
        run: |
          # The guard prints nothing and exits 1 when it cannot read an index, so its exit status
          # is checked here, by name. An empty stdout from a failed run must never read as go.
          if ! reasons=$(node scripts/drift-guard.ts "$RUNNER_TEMP/committed.db" index.db); then
            echo "The guard could not compare the indexes." >&2
            exit 1
          fi
          if [ -n "$reasons" ]; then
            hold=true
            echo "The guard holds the refresh for review:"
            printf '%s\n' "$reasons"
          else
            hold=false
            echo "The guard found no rows lost, so the refresh can merge by itself."
          fi
          # The reasons span lines, so they go out as a heredoc. Its delimiter is random, so no
          # line of the value can end it early.
          delimiter="REASONS_$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          {
            echo "hold=$hold"
            echo "reasons<<$delimiter"
            if [ -n "$reasons" ]; then printf '%s\n' "$reasons"; fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.digests.outputs.changed == 'true' }}
        with:
          name: index
          path: index.db
          if-no-files-found: error
          # A re-run of the pr job can still download it until the next scheduled run.
          retention-days: 7

  pr:
    needs: build
    # A dispatch from another branch builds, tests and guards, and opens, merges and alerts nothing.
    if: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # 60 minutes of it are the wait for the merge, since oldest-consumer takes up to 45.
    timeout-minutes: 75
    # The one job that writes the repository, and only through DRIFT_TOKEN, a fine-grained token
    # with Contents and Pull requests on this repository alone. The drift environment gives it to
    # runs on main only. A push, a pull request or a merge made with github.token starts no
    # workflow, so the pull request's CI and release.yml would never run. The job runs no pnpm
    # script and nothing from the artifact, only git, gh, npm view and node one-liners.
    environment: drift
    permissions:
      contents: read         # the checkout. The token does every write.
    steps:
      # No ref: the commit that triggered the run, which is the one the build job rebuilt.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Switched off by name here too. Left on, it would look for pnpm, which this job never
      # installs, and fail.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index
          path: ${{ runner.temp }}/index
      - name: Take the rebuilt index the build job hashed
        id: verify
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          file="$RUNNER_TEMP/index/index.db"
          # node throws when the artifact holds no index.db, which ends this step red.
          actual=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$file")
          if [ "$actual" != "$SHA256" ]; then
            echo "The artifact's sha256 is $actual, but the build job hashed '$SHA256'." >&2
            exit 1
          fi
          mv "$file" index.db
      - name: Set version to the next patch npm does not have
        id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          # The whole version list, read as release.yml reads it. npm exits non-zero when it
          # cannot read the list, and node throws unless it got a non-empty one. Either
          # assignment then ends this step red, so an outage never passes for an empty list.
          versions=$(npm view "$name" versions --json)
          version=$(node -e '
            const fs = require("node:fs");
            const list = JSON.parse(process.argv[1]);
            if (!Array.isArray(list)) throw new Error("npm printed no version list: " + process.argv[1]);
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            // Only x.y.z counts. release.yml cannot publish a prerelease, and npm leaves prereleases
            // out when it checks a new version against latest.
            const parse = (version) => /^(\d+)\.(\d+)\.(\d+)$/.exec(version)?.slice(1).map(Number);
            const current = parse(manifest.version);
            if (!current) throw new Error("package.json version " + manifest.version + " is not x.y.z");
            // The package major is SCHEMA_VERSION. The suite in the build job checked that on this commit.
            const major = current[0];
            const highest = list.map(parse).filter((v) => v && v[0] === major).sort((a, b) => b[1] - a[1] || b[2] - a[2])[0];
            if (!highest) throw new Error("npm lists no " + major + ".x.y version");
            // Above the highest version npm lists in the major, so npm does not have it.
            const next = [major, highest[1], highest[2] + 1];
            // A next patch at or below package.json means npm does not list that version yet, so
            // its release is pending or failed. A pull request that kept it would publish nothing
            // once that release lands.
            if (next[1] < current[1] || (next[1] === current[1] && next[2] <= current[2])) {
              throw new Error("npm does not list " + manifest.version + " from package.json yet. Let its release finish, or fix it, then run drift again.");
            }
            manifest.version = next.join(".");
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(manifest.version);
          ' "$versions")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The only step that gets the token.
      - name: Push drift/index, open or update its pull request, and get it merged
        id: propose
        env:
          GH_TOKEN: ${{ secrets.DRIFT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMITTED: ${{ needs.build.outputs.committed }}
          REBUILT: ${{ needs.build.outputs.rebuilt }}
          HOLD: ${{ needs.build.outputs.hold }}
          REASONS: ${{ needs.build.outputs.reasons }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          for value in "$COMMITTED" "$REBUILT"; do
            if [[ ! $value =~ ^[0-9a-f]{64}$ ]]; then
              echo "Not a SHA-256 hex digest: '$value'" >&2
              exit 1
            fi
          done
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version: '$VERSION'" >&2
            exit 1
          fi
          # A misspelt output would arrive empty. Only an exact false lets the refresh merge.
          if [ "$HOLD" != true ] && [ "$HOLD" != false ]; then
            echo "Hold is neither true nor false: '$HOLD'" >&2
            exit 1
          fi
          if [ "$HOLD" = true ] && [ -z "$REASONS" ]; then
            echo "The refresh is held, but no reason came with it." >&2
            exit 1
          fi
          # How often and how long the wait for the merge polls, from the environment so the
          # tests can shorten them.
          poll=${POLL_SECONDS:-30}
          limit=${MERGE_DEADLINE_SECONDS:-3600}
          for value in "$poll" "$limit"; do
            if [[ ! $value =~ ^[0-9]+$ ]]; then
              echo "Not a whole number of seconds: '$value'" >&2
              exit 1
            fi
          done

          # The open pull request from drift/index, if there is one, and whether it has auto-merge
          # on, before anything is pushed.
          found=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:drift/index&base=main&state=open" \
            --jq '.[0] // empty | "\(.number) \(.auto_merge != null)"')
          number=
          armed=false
          if [ -n "$found" ]; then
            if [[ ! $found =~ ^([0-9]+)\ (true|false)$ ]]; then
              echo "The lookup of the open pull request printed '$found'." >&2
              exit 1
            fi
            number=${BASH_REMATCH[1]}
            armed=${BASH_REMATCH[2]}
          fi
          # A held refresh turns auto-merge off first, so a failure after this can never leave it
          # armed to merge. gh exits non-zero when it cannot, which ends the step before the push.
          if [ "$HOLD" = true ] && [ "$armed" = true ]; then
            gh pr merge "$number" --disable-auto
          fi

          title="chore: release a refreshed index as $VERSION"
          digests=$(printf 'Committed index digest: %s\nRebuilt index digest: %s' "$COMMITTED" "$REBUILT")
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          body=$(printf 'The drift job rebuilt `index.db`, and its content changed. Merging this pull request publishes `%s`.\n\n- committed index digest: `%s`\n- rebuilt index digest: `%s`\n\nRun: %s/%s/actions/runs/%s\n' \
            "$VERSION" "$COMMITTED" "$REBUILT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ "$HOLD" = true ]; then
            held=$(printf '**Held for review.** The refresh was not merged, because:\n\n'
              while IFS= read -r reason; do printf -- '- %s\n' "$reason"; done <<< "$REASONS")
            body=$(printf '%s\n\n%s' "$held" "$body")
          fi

          git add index.db package.json
          git commit --quiet -m "$title" -m "$digests"
          # The stable branch, replaced on every run. The token reaches git through a credential
          # helper that reads it from the environment, so it is never written to .git/config and
          # never appears on a command line.
          # shellcheck disable=SC2016 # git's shell expands $GH_TOKEN when it runs the helper
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force origin HEAD:refs/heads/drift/index

          if [ -n "$number" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -f body="$body" --jq .html_url
          else
            number=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f head=drift/index -f base=main -f title="$title" -f body="$body" --jq .number)
            if [[ ! $number =~ ^[0-9]+$ ]]; then
              echo "Opening the pull request printed '$number', not its number." >&2
              exit 1
            fi
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number"
          fi

          if [ "$HOLD" = true ]; then
            echo "The refresh is held for review, so pull request #$number is left for a person to merge or close."
            exit 0
          fi
          # A rebase merge, which the ruleset gates on test and oldest-consumer. It merges at once
          # when those have already passed.
          if [ "$armed" != true ]; then
            gh pr merge "$number" --auto --rebase
          fi
          # A red check leaves the pull request open, and the run red, rather than a green run
          # beside a pull request nobody sees.
          echo "Waiting up to $limit seconds for pull request #$number to merge."
          deadline=$((SECONDS + limit))
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.state, .merged')
            case $state in
              $'closed\ntrue')
                echo "Pull request #$number merged, so release.yml publishes $VERSION."
                exit 0
                ;;
              $'closed\nfalse')
                echo "::error::Pull request #$number was closed without merging."
                exit 1
                ;;
              $'open\nfalse') ;;
              *)
                echo "::error::Reading pull request #$number printed '$state'."
                exit 1
                ;;
            esac
            if ((SECONDS + poll >= deadline)); then
              echo "::error::Pull request #$number has not merged $limit seconds after auto-merge was on. Its checks may have failed."
              exit 1
            fi
            sleep "$poll"
          done

  alert:
    needs: [build, pr]
    # On main only, so a dispatch from another branch alerts nothing. always() lets it run after a
    # job that failed.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.pr.result == 'failure' || needs.build.outputs.hold == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Comments on one issue with github.token. It checks nothing out and runs no action.
    permissions:
      issues: write
    steps:
      - name: Comment on the alert issue, or open it
        id: alert
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_RESULT: ${{ needs.pr.result }}
          HOLD: ${{ needs.build.outputs.hold }}
          REASONS: ${{ needs.build.outputs.reasons }}
        run: |
          title='The drift job needs a look'
          text="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          said=false
          if [ "$BUILD_RESULT" = failure ]; then
            text=$(printf '%s\n\nThe build job failed.' "$text")
            said=true
          fi
          if [ "$PR_RESULT" = failure ]; then
            text=$(printf '%s\n\nThe pr job failed.' "$text")
            said=true
          fi
          if [ "$HOLD" = true ]; then
            list=$(while IFS= read -r reason; do printf -- '- %s\n' "$reason"; done <<< "$REASONS")
            text=$(printf '%s\n\nThe refresh was held for review:\n\n%s' "$text" "$list")
            said=true
          fi
          if [ "$said" != true ]; then
            echo "::error::The alert job ran, but no job failed and nothing was held."
            exit 1
          fi

          # The list, not the search API, which lags. A pull request is an issue to this endpoint,
          # and anyone can open an issue with this title, so only one github-actions[bot] opened
          # counts. A failed list ends the step here, so it never opens a second issue. The pages go
          # to a file, since a page of issue bodies can be longer than one argument may be.
          issues="$RUNNER_TEMP/issues.json"
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate --slurp > "$issues"
          number=$(node -e '
            const [file, title] = process.argv.slice(1);
            const found = JSON.parse(require("node:fs").readFileSync(file, "utf8")).flat().find((issue) =>
              issue.title === title && issue.user?.login === "github-actions[bot]" && issue.pull_request === undefined);
            if (found) process.stdout.write(String(found.number));
          ' "$issues" "$title")
          if [ -n "$number" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$text" --jq .html_url
          else
            intro='The drift workflow comments here when a run on main fails or holds a refresh for review. Close this issue once each comment is dealt with, and the next alert opens a new one.'
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f 'assignees[]=drptbl' \
              -f body="$(printf '%s\n\n%s' "$intro" "$text")" --jq .html_url
          fi
