name: drift

# Pins the newest server, rebuilds index.db with it from the live wiki and compares its content
# with the committed index. When the content changed, it pushes drift/index with the rebuilt
# index and the next patch version, or the next minor when the schema grew, opens or updates its
# pull request as the tibia-sh App, turns on auto-merge and waits for the merge. The ruleset
# merges it once test and oldest-consumer pass, and that merge publishes through release.yml.
# When only the pin moved, the pull request carries package.json and pnpm-lock.yaml alone, at the
# same version, and its merge publishes nothing. Nothing here publishes by itself. A refresh that
# loses rows, or a table or column, as scripts/drift-guard.ts decides, is held instead: its pull
# request stays open with auto-merge off until a person merges or closes it. A run on main that
# fails or holds a refresh comments on the one alert issue, which alert.yml also writes for
# release.yml, assigned to the maintainer.

on:
  schedule:
    - cron: '17 6 * * 2,5' # Tuesdays and Fridays at 06:17 UTC
  workflow_dispatch:
  # tibiawiki-mcp's release workflow sends server-release once npm accepted a publish, with
  # {"version": "<x.y.z>"} as its payload. The pin step checks that version whole.
  repository_dispatch:
    types: [server-release]

# Each job asks for what it needs, and a job that asks for nothing gets nothing.
permissions: {}

# Runs take turns, so two cannot push drift/index at once. One in progress is never
# cancelled. The group is not release.yml's, so a drift run never holds up a publish.
concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The 3.0.0 build took just under six minutes on a laptop. The rest is room for the pin
    # step's wait of up to 15 minutes for npm, for uv, and for the wiki API's retries.
    timeout-minutes: 60
    # It runs the generator over content anyone can edit, so it can only read.
    permissions:
      contents: read
    outputs:
      committed: ${{ steps.digests.outputs.committed }}
      rebuilt: ${{ steps.digests.outputs.rebuilt }}
      sha256: ${{ steps.digests.outputs.sha256 }}
      changed: ${{ steps.digests.outputs.changed }}
      # The guard runs only when the content changed. A skipped step's output is empty, so hold
      # falls back to false and the alert job never reads an empty value.
      hold: ${{ steps.guard.outputs.hold || 'false' }}
      reasons: ${{ steps.guard.outputs.reasons }}
      # The schema level runs only when the content changed too, so it falls back to patch, and a
      # pin-only run hands on a level the pr job accepts and does not use.
      level: ${{ steps.schema.outputs.level || 'patch' }}
      server: ${{ steps.pin.outputs.server }}
      pin_moved: ${{ steps.pin.outputs.pin_moved }}
      package_json_sha256: ${{ steps.pin.outputs.package_json_sha256 }}
      pnpm_lock_sha256: ${{ steps.pin.outputs.pnpm_lock_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # No cache, restored or saved, but pnpm/setup's lockfile-verification record. A cache saved
      # after the generator ran would carry whatever that run left into later runs. This setup-node
      # caches by itself whenever package.json names a packageManager, so it is switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      # It leaves the pnpm store uncached, and saves its lockfile-verification record right after
      # the install, before the generator runs. When that save does not go through, its post step
      # tries again at the end of the job, after the generator.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      # The server this run builds and tests the index with, before the generator runs: the version
      # a server-release dispatch asks for, or the newest npm lists, as scripts/server-pin.ts
      # decides. A move waits up to 15 minutes, checking every 30 seconds, until npm lists the
      # version and its tarball answers, since pnpm add fails on a version npm does not serve yet.
      # The step holds no token. The dispatch's version is data, checked whole before any use. The
      # hashes of the two manifests let the pr job require the ones this job built index.db with.
      - name: Pin the server
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.client_payload.version }}
        run: |
          current=$(node -p 'require("./package.json").devDependencies["@tibia.sh/tibiawiki-mcp"]')
          requested=
          if [ "$EVENT" = repository_dispatch ]; then
            if [[ ! $REQUESTED =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The server-release dispatch asks for '$REQUESTED', not an x.y.z version." >&2
              exit 1
            fi
            requested=$REQUESTED
          fi
          latest=$(npm view @tibia.sh/tibiawiki-mcp version)
          # server-pin.ts checks all three versions whole, and exits 1 on one that is not x.y.z.
          decision=$(node scripts/server-pin.ts "$current" "$latest" ${requested:+"$requested"})
          if [[ ! $decision =~ ^(keep|move|refuse)\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "scripts/server-pin.ts printed '$decision'." >&2
            exit 1
          fi
          action=${BASH_REMATCH[1]}
          server=${BASH_REMATCH[2]}
          pin_moved=false
          case $action in
            keep)
              echo "The server stays at $server."
              ;;
            refuse)
              # A dispatch that arrived after a newer server was pinned. The pin never moves down,
              # and the run goes on with the pin as it is.
              echo "::notice::The dispatch asks for server $requested, below the pinned $current, so the pin stays at $current."
              ;;
            move)
              # How often and how long the wait polls, from the environment so the tests can
              # shorten them.
              poll=${POLL_SECONDS:-30}
              limit=${DEADLINE_SECONDS:-900}
              for value in "$poll" "$limit"; do
                if [[ ! $value =~ ^[0-9]+$ ]]; then
                  echo "Not a whole number of seconds: '$value'" >&2
                  exit 1
                fi
              done
              # The one tarball npm may list for it. A HEAD goes to nothing else.
              tarball="https://registry.npmjs.org/@tibia.sh/tibiawiki-mcp/-/tibiawiki-mcp-$server.tgz"
              echo "Waiting up to $limit seconds for npm to serve server $server."
              deadline=$((SECONDS + limit))
              while :; do
                # npm exits non-zero for a version it does not list yet, which is a reason to wait.
                listed=$(npm view "@tibia.sh/tibiawiki-mcp@$server" dist.tarball) || listed=
                if [ "$listed" = "$tarball" ]; then
                  status=$(curl --silent --head --output /dev/null --write-out '%{http_code}' --max-time 30 "$tarball") || status=
                  if [ "$status" = 200 ]; then
                    break
                  fi
                fi
                if ((SECONDS + poll >= deadline)); then
                  echo "::error::npm did not serve server $server within $limit seconds."
                  exit 1
                fi
                sleep "$poll"
              done
              pnpm add -D --save-exact "@tibia.sh/tibiawiki-mcp@$server"
              pinned=$(node -p 'require("./package.json").devDependencies["@tibia.sh/tibiawiki-mcp"]')
              if [ "$pinned" != "$server" ]; then
                echo "The add left the server pinned as '$pinned', not $server." >&2
                exit 1
              fi
              pin_moved=true
              ;;
          esac
          sha256() {
            node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$1"
          }
          package_json_sha256=$(sha256 package.json)
          pnpm_lock_sha256=$(sha256 pnpm-lock.yaml)
          {
            echo "server=$server"
            echo "pin_moved=$pin_moved"
            echo "package_json_sha256=$package_json_sha256"
            echo "pnpm_lock_sha256=$pnpm_lock_sha256"
          } >> "$GITHUB_OUTPUT"
      # build-index installs and runs the generator with uv. This setup-uv ships a checksum for uv 0.12.4
      # and installs no download that fails it. It has no checksum for a later uv, and skips the
      # check for one, so the version stays exact and no newer than the action.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          enable-cache: false
      # Before the build, which overwrites index.db in place. The digest covers every table and
      # column but the per-row timestamp and database_info's run stamps, as the script says.
      - name: Digest the committed index
        id: committed
        run: |
          digest=$(node scripts/index-digest.ts index.db)
          if [[ ! $digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "scripts/index-digest.ts did not print a SHA-256 hex digest for the committed index." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The guard compares the rebuilt index's row counts with these.
      - name: Keep the committed index for the guard
        run: |
          cp index.db "$RUNNER_TEMP/committed.db"
      # A tripped gate fails the run here, and leaves index.db as it was. scripts/build.ts
      # gives the generator its PyPI cooldown, so this step sets none.
      - run: pnpm build-index
      - name: Digest the rebuilt index
        id: digests
        env:
          COMMITTED: ${{ steps.committed.outputs.digest }}
        run: |
          rebuilt=$(node scripts/index-digest.ts index.db)
          # The pr job checks the artifact it downloads against this.
          sha256=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("index.db")).digest("hex"))')
          # COMMITTED too: a misspelt output reference arrives as an empty string, and two
          # empty digests would compare equal on every run.
          for value in "$COMMITTED" "$rebuilt"; do
            if [[ ! $value =~ ^[0-9a-f]{64}$ ]]; then
              echo "Not a SHA-256 hex digest: '$value'" >&2
              exit 1
            fi
          done
          echo "Committed index digest: $COMMITTED"
          echo "Rebuilt index digest:   $rebuilt"
          if [ "$COMMITTED" = "$rebuilt" ]; then
            changed=false
            echo "The content did not change, so no pull request is opened."
          else
            changed=true
            echo "The content changed, so the pr job opens or updates the drift pull request."
          fi
          {
            echo "committed=$COMMITTED"
            echo "rebuilt=$rebuilt"
            echo "sha256=$sha256"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
      # The suite, against the rebuilt index, before anything leaves this job.
      - run: pnpm test
      # Whether the refresh may merge by itself. Each line the guard prints is a reason to hold it
      # for a person, and none means go.
      - name: Guard the refresh
        id: guard
        if: ${{ steps.digests.outputs.changed == 'true' }}
        run: |
          # The guard prints nothing and exits 1 when it cannot read an index, so its exit status
          # is checked here, by name. An empty stdout from a failed run must never read as go.
          if ! reasons=$(node scripts/drift-guard.ts "$RUNNER_TEMP/committed.db" index.db); then
            echo "The guard could not compare the indexes." >&2
            exit 1
          fi
          if [ -n "$reasons" ]; then
            hold=true
            echo "The guard holds the refresh for review:"
            printf '%s\n' "$reasons"
          else
            hold=false
            echo "The guard found no rows lost, so the refresh can merge by itself."
          fi
          # The reasons span lines, so they go out as a heredoc. Its delimiter is random, so no
          # line of the value can end it early.
          delimiter="REASONS_$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          {
            echo "hold=$hold"
            echo "reasons<<$delimiter"
            if [ -n "$reasons" ]; then printf '%s\n' "$reasons"; fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      # The version level of the refresh. A table or column the rebuilt index added ships as a
      # minor, since only a server that reads it can use it, and anything else as a patch. What it
      # removed, the guard holds for a person.
      - name: Schema level
        id: schema
        if: ${{ steps.digests.outputs.changed == 'true' }}
        run: |
          if ! diff=$(node scripts/schema-diff.ts "$RUNNER_TEMP/committed.db" index.db); then
            echo "The schemas could not be compared." >&2
            exit 1
          fi
          level=$(node -e '
            const { added, removed } = JSON.parse(process.argv[1]);
            if (!Array.isArray(added) || !Array.isArray(removed)) throw new Error("scripts/schema-diff.ts printed no added and removed lists");
            process.stdout.write(added.length > 0 ? "minor" : "patch");
          ' "$diff")
          echo "Schema difference: $diff"
          echo "level=$level" >> "$GITHUB_OUTPUT"
      # The pr job runs when the content changed or the pin moved, and downloads the artifact either
      # way. It holds index.db alone: the pr job recomputes the manifests itself.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.digests.outputs.changed == 'true' || steps.pin.outputs.pin_moved == 'true' }}
        with:
          name: index
          path: index.db
          if-no-files-found: error
          # A re-run of the pr job can still download it until the next scheduled run.
          retention-days: 7

  pr:
    needs: build
    # A dispatch from another branch builds, tests and guards, and opens, merges and alerts nothing.
    if: ${{ github.ref == 'refs/heads/main' && (needs.build.outputs.changed == 'true' || needs.build.outputs.pin_moved == 'true') }}
    runs-on: ubuntu-latest
    # 60 minutes of it are the wait for the merge, since oldest-consumer takes up to 45.
    timeout-minutes: 75
    # The one job that writes the repository, and only through a token of the tibia-sh App, with
    # contents and pull requests write on this repository alone. The drift environment deploys
    # from main only. A push, a pull request or a merge made with github.token starts no workflow,
    # so the pull request's CI and release.yml would never run. The job installs nothing and runs
    # no pnpm script, no dependency code and nothing from the artifact: only git, gh, npm view,
    # node on its own checkout, and pnpm add on the lockfile alone. The build job ran the
    # generator, so what it hands on is data, checked whole before any use.
    environment: drift
    permissions:
      contents: read         # the checkout. The App token does every write.
      pull-requests: read    # the wait for the merge, which reads with github.token
    steps:
      # No ref: the commit that triggered the run, which is the one the build job rebuilt.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Switched off by name here too. Left on, it would restore a pnpm store cache.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Each value the build job handed on, checked whole: changed and pin_moved are true or false,
      # level is patch or minor, and server is x.y.z, above main's pin when it moved and main's pin
      # when it did not, as scripts/server-pin.ts compares them.
      - name: Check the build job's outputs
        id: check
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
          PIN_MOVED: ${{ needs.build.outputs.pin_moved }}
          LEVEL: ${{ needs.build.outputs.level }}
          SERVER: ${{ needs.build.outputs.server }}
        run: |
          if [ "$CHANGED" != true ] && [ "$CHANGED" != false ]; then
            echo "changed is neither true nor false: '$CHANGED'" >&2
            exit 1
          fi
          if [ "$PIN_MOVED" != true ] && [ "$PIN_MOVED" != false ]; then
            echo "pin_moved is neither true nor false: '$PIN_MOVED'" >&2
            exit 1
          fi
          if [ "$CHANGED" = false ] && [ "$PIN_MOVED" = false ]; then
            echo "Neither the content nor the pin changed, so there is nothing to propose." >&2
            exit 1
          fi
          if [ "$LEVEL" != patch ] && [ "$LEVEL" != minor ]; then
            echo "level is neither patch nor minor: '$LEVEL'" >&2
            exit 1
          fi
          if [[ ! $SERVER =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a server version: '$SERVER'" >&2
            exit 1
          fi
          pin=$(node -p 'require("./package.json").devDependencies["@tibia.sh/tibiawiki-mcp"]')
          decision=$(node scripts/server-pin.ts "$pin" "$pin" "$SERVER")
          if [ "$PIN_MOVED" = true ] && [ "$decision" != "move $SERVER" ]; then
            echo "The build job moved the pin from $pin to $SERVER, which is not above it." >&2
            exit 1
          fi
          if [ "$PIN_MOVED" = false ] && [ "$decision" != "keep $pin" ]; then
            echo "The build job kept the pin at $SERVER, but main pins $pin." >&2
            exit 1
          fi
      # Installs the pnpm that packageManager names, and no dependency. Even with install: false,
      # pnpm/setup restores its lockfile-verification cache whenever the file cache-dependency-path
      # names hashes to something, and the build job, which runs the generator, could have planted
      # that archive, whose paths can reach anywhere the runner user writes. The path names a file
      # the repository never holds, so the hash is empty and the action restores and saves no cache.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache-dependency-path: .pr-job-restores-no-cache
      # The pin the build job moved, recomputed here on the lockfile alone: no node_modules, no
      # package script, no pnpmfile and no dependency code. The package.json and pnpm-lock.yaml
      # this job commits are the ones it produced, never the build job's.
      - name: Recompute the pin
        id: recompute
        if: ${{ needs.build.outputs.pin_moved == 'true' }}
        env:
          SERVER: ${{ needs.build.outputs.server }}
        run: |
          if [[ ! $SERVER =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a server version: '$SERVER'" >&2
            exit 1
          fi
          pnpm add -D --save-exact --lockfile-only --ignore-scripts --ignore-pnpmfile "@tibia.sh/tibiawiki-mcp@$SERVER"
      # The recompute changed package.json and pnpm-lock.yaml and nothing else, and package.json in
      # the value of the server's devDependency alone, byte for byte.
      - name: Keep the recompute to the pin
        id: scope
        if: ${{ needs.build.outputs.pin_moved == 'true' }}
        env:
          SERVER: ${{ needs.build.outputs.server }}
        run: |
          files=$(git diff --name-only)
          if [ "$files" != "$(printf 'package.json\npnpm-lock.yaml')" ]; then
            echo "The recompute changed other files than package.json and pnpm-lock.yaml:" >&2
            printf '%s\n' "$files" >&2
            exit 1
          fi
          git show HEAD:package.json > "$RUNNER_TEMP/main-package.json"
          node -e '
            const fs = require("node:fs");
            const [main, server] = process.argv.slice(1);
            const name = "@tibia.sh/tibiawiki-mcp";
            const before = fs.readFileSync(main, "utf8");
            const after = fs.readFileSync("package.json", "utf8");
            const entry = (version) => JSON.stringify(name) + ": " + JSON.stringify(version);
            const parts = before.split(entry(JSON.parse(before).devDependencies[name]));
            if (parts.length !== 2) throw new Error("the package.json of main does not pin " + name + " exactly once");
            if (after !== parts.join(entry(server))) throw new Error("package.json changed in more than the pin of " + name);
          ' "$RUNNER_TEMP/main-package.json" "$SERVER"
      # The recomputed manifests are byte for byte the ones the build job installed from, so the
      # committed lockfile is provably the one that built index.db.
      - name: Require the manifests the build job built with
        id: manifests
        if: ${{ needs.build.outputs.pin_moved == 'true' }}
        env:
          PACKAGE_JSON_SHA256: ${{ needs.build.outputs.package_json_sha256 }}
          PNPM_LOCK_SHA256: ${{ needs.build.outputs.pnpm_lock_sha256 }}
        run: |
          for value in "$PACKAGE_JSON_SHA256" "$PNPM_LOCK_SHA256"; do
            if [[ ! $value =~ ^[0-9a-f]{64}$ ]]; then
              echo "Not a SHA-256 hex digest: '$value'" >&2
              exit 1
            fi
          done
          sha256() {
            node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$1"
          }
          package_json=$(sha256 package.json)
          pnpm_lock=$(sha256 pnpm-lock.yaml)
          if [ "$package_json" != "$PACKAGE_JSON_SHA256" ]; then
            echo "The recomputed package.json hashes to $package_json, but the build job built with $PACKAGE_JSON_SHA256." >&2
            exit 1
          fi
          if [ "$pnpm_lock" != "$PNPM_LOCK_SHA256" ]; then
            echo "The recomputed pnpm-lock.yaml hashes to $pnpm_lock, but the build job built with $PNPM_LOCK_SHA256." >&2
            exit 1
          fi
          echo "package.json and pnpm-lock.yaml are the ones the build job built index.db with."
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index
          path: ${{ runner.temp }}/index
      # Only a refresh whose content changed takes the rebuilt index. A pin-only run leaves index.db
      # as main has it.
      - name: Take the rebuilt index the build job hashed
        id: verify
        if: ${{ needs.build.outputs.changed == 'true' }}
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          file="$RUNNER_TEMP/index/index.db"
          # node throws when the artifact holds no index.db, which ends this step red.
          actual=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$file")
          if [ "$actual" != "$SHA256" ]; then
            echo "The artifact's sha256 is $actual, but the build job hashed '$SHA256'." >&2
            exit 1
          fi
          mv "$file" index.db
      # A refresh whose content changed gets the next patch or minor, as the build job's schema
      # level says. A pin-only run keeps the version, so its merge publishes nothing.
      - name: Set version to the next patch or minor npm does not have
        id: version
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
          LEVEL: ${{ needs.build.outputs.level }}
        run: |
          if [ "$CHANGED" != true ]; then
            version=$(node -p 'require("./package.json").version')
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "package.json version $version is not x.y.z." >&2
              exit 1
            fi
            echo "The content did not change, so the version stays $version and nothing is published."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name=$(node -p 'require("./package.json").name')
          # The whole version list, read as release.yml reads it. npm exits non-zero when it
          # cannot read the list, and node throws unless it got a non-empty one. Either
          # assignment then ends this step red, so an outage never passes for an empty list.
          versions=$(npm view "$name" versions --json)
          version=$(node -e '
            const fs = require("node:fs");
            const [text, level] = process.argv.slice(1);
            if (level !== "patch" && level !== "minor") throw new Error("level is neither patch nor minor: " + level);
            const list = JSON.parse(text);
            if (!Array.isArray(list)) throw new Error("npm printed no version list: " + text);
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            // Only x.y.z counts. release.yml cannot publish a prerelease, and npm leaves prereleases
            // out when it checks a new version against latest.
            const parse = (version) => /^(\d+)\.(\d+)\.(\d+)$/.exec(version)?.slice(1).map(Number);
            const current = parse(manifest.version);
            if (!current) throw new Error("package.json version " + manifest.version + " is not x.y.z");
            // The package major is SCHEMA_VERSION. The suite in the build job checked that on this commit.
            const major = current[0];
            const highest = list.map(parse).filter((v) => v && v[0] === major).sort((a, b) => b[1] - a[1] || b[2] - a[2])[0];
            if (!highest) throw new Error("npm lists no " + major + ".x.y version");
            // Above the highest version npm lists in the major, so npm does not have it.
            const next = level === "minor" ? [major, highest[1] + 1, 0] : [major, highest[1], highest[2] + 1];
            // A next version at or below package.json means npm does not list that version yet, so
            // its release is pending or failed. A pull request that kept it would publish nothing
            // once that release lands.
            if (next[1] < current[1] || (next[1] === current[1] && next[2] <= current[2])) {
              throw new Error("npm does not list " + manifest.version + " from package.json yet. Let its release finish, or fix it, then run drift again.");
            }
            manifest.version = next.join(".");
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(manifest.version);
          ' "$versions" "$LEVEL")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A token of the tibia-sh App for this repository alone, with contents and pull requests
      # write, which expires within the hour. The pull request it opens runs CI, and the merge
      # auto-merge makes for it starts release.yml, which neither would with github.token. It is
      # minted after the steps that read the artifact and npm, so none of them runs with it.
      - name: Get a token of the tibia-sh App
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TIBIA_SH_APP_CLIENT_ID }}
          private-key: ${{ secrets.TIBIA_SH_APP_PRIVATE_KEY }}
          owner: tibia-sh
          repositories: tibiawiki-data
          permission-contents: write
          permission-pull-requests: write
      # The only step that gets the App token. It ends once auto-merge is on, and hands the wait
      # the pull request and the commit it pushed.
      - name: Push drift/index, open or update its pull request, and turn on auto-merge
        id: propose
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER: ${{ needs.build.outputs.server }}
          CHANGED: ${{ needs.build.outputs.changed }}
          COMMITTED: ${{ needs.build.outputs.committed }}
          REBUILT: ${{ needs.build.outputs.rebuilt }}
          HOLD: ${{ needs.build.outputs.hold }}
          REASONS: ${{ needs.build.outputs.reasons }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          for value in "$COMMITTED" "$REBUILT"; do
            if [[ ! $value =~ ^[0-9a-f]{64}$ ]]; then
              echo "Not a SHA-256 hex digest: '$value'" >&2
              exit 1
            fi
          done
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version: '$VERSION'" >&2
            exit 1
          fi
          if [[ ! $SERVER =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a server version: '$SERVER'" >&2
            exit 1
          fi
          if [ "$CHANGED" != true ] && [ "$CHANGED" != false ]; then
            echo "Changed is neither true nor false: '$CHANGED'" >&2
            exit 1
          fi
          # A misspelt output would arrive empty. Only an exact false lets the refresh merge.
          if [ "$HOLD" != true ] && [ "$HOLD" != false ]; then
            echo "Hold is neither true nor false: '$HOLD'" >&2
            exit 1
          fi
          if [ "$HOLD" = true ] && [ -z "$REASONS" ]; then
            echo "The refresh is held, but no reason came with it." >&2
            exit 1
          fi

          # The open pull request from drift/index, if there is one, and whether it has auto-merge
          # on, before anything is pushed.
          found=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:drift/index&base=main&state=open" \
            --jq '.[0] // empty | "\(.number) \(.auto_merge != null)"')
          number=
          armed=false
          if [ -n "$found" ]; then
            if [[ ! $found =~ ^([0-9]+)\ (true|false)$ ]]; then
              echo "The lookup of the open pull request printed '$found'." >&2
              exit 1
            fi
            number=${BASH_REMATCH[1]}
            armed=${BASH_REMATCH[2]}
          fi
          # A held refresh turns auto-merge off first, so a failure after this can never leave it
          # armed to merge. gh exits non-zero when it cannot, which ends the step before the push.
          if [ "$HOLD" = true ] && [ "$armed" = true ]; then
            gh pr merge "$number" --disable-auto
          fi

          digests=$(printf 'Committed index digest: %s\nRebuilt index digest: %s' "$COMMITTED" "$REBUILT")
          # A refresh carries the rebuilt index, and the pin when it moved too. A pin-only run
          # carries the two manifests alone, at the version main has, so its merge publishes nothing.
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          if [ "$CHANGED" = true ]; then
            title="chore: release a refreshed index as $VERSION"
            body=$(printf 'The drift job rebuilt `index.db`, and its content changed. Merging this pull request publishes `%s`.\n\n- committed index digest: `%s`\n- rebuilt index digest: `%s`\n\nRun: %s/%s/actions/runs/%s\n' \
              "$VERSION" "$COMMITTED" "$REBUILT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            files=(index.db package.json pnpm-lock.yaml)
          else
            title="chore: pin the server at $SERVER"
            body=$(printf 'The drift job pinned `@tibia.sh/tibiawiki-mcp` at `%s`, and the index it rebuilt with it did not change. Merging this pull request publishes nothing: the version stays `%s`.\n\nRun: %s/%s/actions/runs/%s\n' \
              "$SERVER" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            files=(package.json pnpm-lock.yaml)
          fi
          if [ "$HOLD" = true ]; then
            held=$(printf '**Held for review.** The refresh was not merged, because:\n\n'
              while IFS= read -r reason; do printf -- '- %s\n' "$reason"; done <<< "$REASONS")
            body=$(printf '%s\n\n%s' "$held" "$body")
          fi

          git add "${files[@]}"
          git commit --quiet -m "$title" -m "$digests"
          # The commit this run pushes. The wait takes only a merge of it as this run's.
          head=$(git rev-parse HEAD)
          if [[ ! $head =~ ^[0-9a-f]{40}$ ]]; then
            echo "git rev-parse HEAD printed '$head', not a commit." >&2
            exit 1
          fi
          # The stable branch, replaced on every run. The token reaches git through a credential
          # helper that reads it from the environment, so it is never written to .git/config and
          # never appears on a command line.
          # shellcheck disable=SC2016 # git's shell expands $GH_TOKEN when it runs the helper
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force origin HEAD:refs/heads/drift/index

          # Reads pull request $number into state, merged, auto and sha. It returns non-zero when gh
          # fails, and ends the step when gh answers with another shape.
          read_pull_request() {
            local view
            view=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"\(.state) \(.merged) \(.auto_merge != null) \(.head.sha)"') || return 1
            if [[ ! $view =~ ^(open|closed)\ (true|false)\ (true|false)\ ([0-9a-f]{40})$ ]]; then
              echo "::error::Reading pull request #$number printed '$view'."
              exit 1
            fi
            state=${BASH_REMATCH[1]}
            merged=${BASH_REMATCH[2]}
            auto=${BASH_REMATCH[3]}
            sha=${BASH_REMATCH[4]}
          }

          # The pull request the lookup found can have merged or closed between the lookup and the
          # push. So it is read again by number after the update. A merge of the commit this run
          # pushed is this run's, and ends the step. Closed any other way, a new pull request is
          # opened for drift/index. Auto-merge is turned on or off from this state.
          if [ -n "$number" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -f body="$body" --jq .html_url
            read_pull_request
            if [ "$merged" = true ] && [ "$sha" = "$head" ]; then
              if [ "$CHANGED" = true ]; then
                echo "Pull request #$number merged $head already, so release.yml publishes $VERSION."
              else
                echo "Pull request #$number merged $head already, so release.yml publishes nothing: it moved the pin alone, and the version stays $VERSION."
              fi
              exit 0
            fi
            armed=$auto
            if [ "$state" != open ]; then
              echo "Pull request #$number closed before this push without merging it, so a new one is opened."
              number=
            fi
          fi
          if [ -z "$number" ]; then
            number=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f head=drift/index -f base=main -f title="$title" -f body="$body" --jq .number)
            if [[ ! $number =~ ^[0-9]+$ ]]; then
              echo "Opening the pull request printed '$number', not its number." >&2
              exit 1
            fi
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number"
            armed=false
          fi

          if [ "$HOLD" = true ]; then
            # Auto-merge turned on since the lookup, by a person or by another run.
            if [ "$armed" = true ]; then
              gh pr merge "$number" --disable-auto
            fi
            echo "The refresh is held for review, so pull request #$number is left for a person to merge or close."
            exit 0
          fi
          # A rebase merge, which the ruleset gates on test and oldest-consumer. It merges at once
          # when those have already passed.
          if [ "$armed" != true ]; then
            gh pr merge "$number" --auto --rebase
          fi
          {
            echo "number=$number"
            echo "head=$head"
            echo "wait=true"
          } >> "$GITHUB_OUTPUT"
      # A red check leaves the pull request open, and the run red, rather than a green run beside a
      # pull request nobody sees. Only a merge of the commit propose pushed counts. The wait reads
      # with github.token, since the App token expires within the hour and the wait can take all of
      # it. It only reads: auto-merge turned on with github.token would merge as
      # github-actions[bot], and that push would start no release.yml.
      - name: Wait for the pull request to merge the pushed commit
        id: wait
        if: ${{ steps.propose.outputs.wait == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.propose.outputs.number }}
          HEAD: ${{ steps.propose.outputs.head }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ needs.build.outputs.changed }}
        run: |
          if [[ ! $NUMBER =~ ^[0-9]+$ ]]; then
            echo "Not a pull request number: '$NUMBER'" >&2
            exit 1
          fi
          if [[ ! $HEAD =~ ^[0-9a-f]{40}$ ]]; then
            echo "Not a commit: '$HEAD'" >&2
            exit 1
          fi
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version: '$VERSION'" >&2
            exit 1
          fi
          # A refresh publishes its version once merged. A pin-only pull request keeps the version
          # npm has, so its merge publishes nothing.
          if [ "$CHANGED" = true ]; then
            merged_means="release.yml publishes $VERSION"
          elif [ "$CHANGED" = false ]; then
            merged_means="release.yml publishes nothing: it moved the pin alone, and the version stays $VERSION"
          else
            echo "Changed is neither true nor false: '$CHANGED'" >&2
            exit 1
          fi
          # How often and how long the wait polls, and how long it pauses after a failed read,
          # from the environment so the tests can shorten them.
          poll=${POLL_SECONDS:-30}
          limit=${MERGE_DEADLINE_SECONDS:-3600}
          retry=${RETRY_SECONDS:-10}
          for value in "$poll" "$limit" "$retry"; do
            if [[ ! $value =~ ^[0-9]+$ ]]; then
              echo "Not a whole number of seconds: '$value'" >&2
              exit 1
            fi
          done

          # Reads pull request $NUMBER into state, merged, auto and sha, as propose does. It returns
          # non-zero when gh fails, and ends the step when gh answers with another shape.
          read_pull_request() {
            local view
            view=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '"\(.state) \(.merged) \(.auto_merge != null) \(.head.sha)"') || return 1
            if [[ ! $view =~ ^(open|closed)\ (true|false)\ (true|false)\ ([0-9a-f]{40})$ ]]; then
              echo "::error::Reading pull request #$NUMBER printed '$view'."
              exit 1
            fi
            state=${BASH_REMATCH[1]}
            merged=${BASH_REMATCH[2]}
            auto=${BASH_REMATCH[3]}
            sha=${BASH_REMATCH[4]}
          }

          echo "Waiting up to $limit seconds for pull request #$NUMBER to merge $HEAD."
          deadline=$((SECONDS + limit))
          failed=0
          while :; do
            # gh can fail for a moment in an hour of reads. Three failed reads in a row end the
            # wait, and a good read starts the count again.
            if ! read_pull_request; then
              failed=$((failed + 1))
              if ((failed >= 3)); then
                echo "::error::Reading pull request #$NUMBER failed 3 times in a row."
                exit 1
              fi
              echo "Reading pull request #$NUMBER failed, so it is read again in $retry seconds."
              sleep "$retry"
              continue
            fi
            failed=0
            if [ "$merged" = true ]; then
              if [ "$sha" != "$HEAD" ]; then
                echo "::error::Pull request #$NUMBER merged $sha, not $HEAD, the commit this run pushed."
                exit 1
              fi
              echo "Pull request #$NUMBER merged $HEAD, so $merged_means."
              exit 0
            fi
            if [ "$state" = closed ]; then
              echo "::error::Pull request #$NUMBER was closed without merging."
              exit 1
            fi
            if [ "$auto" = false ]; then
              echo "::error::Auto-merge on pull request #$NUMBER is off. Merge it, or turn auto-merge on again, by hand."
              exit 1
            fi
            if ((SECONDS + poll >= deadline)); then
              echo "::error::Pull request #$NUMBER has not merged $limit seconds after auto-merge was on. Its checks may have failed."
              exit 1
            fi
            sleep "$poll"
          done

  alert:
    needs: [build, pr]
    # On main only, so a dispatch from another branch alerts nothing. always() lets it run after a
    # job that did not succeed. GitHub can report a job that hit its timeout-minutes as cancelled
    # rather than failed, so anything but success alerts, except a pr job skipped because nothing
    # changed or the build job did not succeed.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.result != 'success' || (needs.pr.result != 'success' && needs.pr.result != 'skipped') || needs.build.outputs.hold == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Comments on one issue with github.token. It checks nothing out and runs no action. It takes
    # turns with alert.yml, which writes the same issue, and none of their waiting runs is replaced,
    # so no alert is dropped and no second issue is opened.
    permissions:
      issues: write
    concurrency: { group: automation-alert, cancel-in-progress: false, queue: max }
    steps:
      - name: Comment on the alert issue, or open it
        id: alert
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_RESULT: ${{ needs.pr.result }}
          HOLD: ${{ needs.build.outputs.hold }}
          REASONS: ${{ needs.build.outputs.reasons }}
        run: |
          title='Automation needs a look'
          text="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          said=false
          if [ "$BUILD_RESULT" != success ]; then
            text=$(printf '%s\n\nThe build job did not succeed. Its result is %s.' "$text" "$BUILD_RESULT")
            said=true
          fi
          if [ "$PR_RESULT" != success ] && [ "$PR_RESULT" != skipped ]; then
            text=$(printf '%s\n\nThe pr job did not succeed. Its result is %s.' "$text" "$PR_RESULT")
            said=true
          fi
          if [ "$HOLD" = true ]; then
            list=$(while IFS= read -r reason; do printf -- '- %s\n' "$reason"; done <<< "$REASONS")
            text=$(printf '%s\n\nThe refresh was held for review:\n\n%s' "$text" "$list")
            said=true
          fi
          if [ "$said" != true ]; then
            echo "::error::The alert job ran, but every job succeeded and nothing was held."
            exit 1
          fi

          # The list, not the search API, which lags. A pull request is an issue to this endpoint,
          # and anyone can open an issue with this title, so only one github-actions[bot] opened
          # counts. A failed list ends the step here, so it never opens a second issue. The pages go
          # to a file, since a page of issue bodies can be longer than one argument may be.
          # alert.yml finds and opens the issue with this same program and intro.
          issues="$RUNNER_TEMP/issues.json"
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate --slurp > "$issues"
          number=$(node -e '
            const [file, title] = process.argv.slice(1);
            const found = JSON.parse(require("node:fs").readFileSync(file, "utf8")).flat().find((issue) =>
              issue.title === title && issue.user?.login === "github-actions[bot]" && issue.pull_request === undefined);
            if (found) process.stdout.write(String(found.number));
          ' "$issues" "$title")
          if [ -n "$number" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$text" --jq .html_url
          else
            intro='The drift and release workflows comment here when a run on main does not succeed, and drift when it holds a refresh for review. Close this issue once each comment is dealt with, and the next alert opens a new one.'
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f 'assignees[]=drptbl' \
              -f body="$(printf '%s\n\n%s' "$intro" "$text")" --jq .html_url
          fi
