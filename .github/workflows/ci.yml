name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # pnpm/setup caches the pnpm store. This setup-node caches by itself whenever
      # package.json names a packageManager, so it is switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
          cache: true
      # `pnpm test` builds, typechecks, and runs the suite - including the test that
      # spawns the server from the devDependency against the committed index.db and
      # makes a real query.
      - run: pnpm test

  # The gate release.yml runs before it publishes. The oldest and the newest published servers
  # that depend on this package's major, each installed together with the packed index, page
  # every item. scripts/oldest-consumer.ts says why.
  oldest-consumer:
    runs-on: ubuntu-latest
    # The script's own bounds add up to 2190 s, summed beside the value: 120 s to pack the
    # candidate and 30 s for the registry, then 120 s to pack, 300 s to install and 600 s to
    # sweep each of two consumers. The rest is room for checkout and setup.
    timeout-minutes: 45  # 120 + 30 + 2 * (120 + 300 + 600) = 2190 s, 36.5 minutes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # pnpm/setup caches the pnpm store. This setup-node caches by itself whenever
      # package.json names a packageManager, so it is switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # The npm release.yml installs, so the gate packs and installs with that same npm.
      - run: npm install -g npm@12.0.2
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
          cache: true
      - run: pnpm oldest-consumer
