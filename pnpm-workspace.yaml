savePrefix: ''
minimumReleaseAge: 10080
# Strict is pnpm's default once minimumReleaseAge is set, and it is stated here so the
# cooldown fails a resolution instead of falling back to an immature version.
minimumReleaseAgeStrict: true
# First-party packages skip the 7-day cooldown. The devDependency on
# @tibia.sh/tibiawiki-mcp is installed minutes after each server release, and pnpm
# fails such an install rather than waiting. The cooldown exists to let the ecosystem
# catch a compromised upstream release. A first-party publish is gated by its own
# release procedure instead.
minimumReleaseAgeExclude:
  - '@tibia.sh/*'
  # pnpm itself skips the cooldown too, by the maintainer's decision of 2026-09-24: the repo
  # takes each pnpm release when it comes out. packageManager pins the exact version and the
  # lockfile holds its integrity, so the exclude only matters when that pin is moved on purpose.
  - pnpm
  - '@pnpm/exe.*'
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds: {}
verifyDepsBeforeRun: error
# pnpm 11 replaced packageManagerStrictVersion and managePackageManagerVersions with this.
# A pnpm other than packageManager's switches to that exact version.
pmOnFail: download
