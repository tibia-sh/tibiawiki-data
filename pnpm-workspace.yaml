savePrefix: ''
minimumReleaseAge: 10080
# First-party packages skip the 7-day cooldown. The devDependency on
# @tibia.sh/tibiawiki-mcp is installed minutes after each server release, and
# pnpm 10.33.0 fails such an install with ERR_PNPM_NO_MATURE_MATCHING_VERSION
# rather than waiting. The cooldown exists to let the ecosystem catch a
# compromised upstream release; a first-party publish is gated by its own release
# procedure instead.
minimumReleaseAgeExclude:
  - '@tibia.sh/*'
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds: {}
verifyDepsBeforeRun: error
packageManagerStrictVersion: true
managePackageManagerVersions: true
